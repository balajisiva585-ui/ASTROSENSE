services:
  - type: web
    name: astrosense-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_AUTO_SYNC
        value: "true"
      - key: DATABASE_SYNC_INTERVAL_MS
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: astrosense-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: astrosense-client
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: astrosense-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: astrosense-server
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: astrosense-db
    plan: free
    region: oregon
    databaseName: astrosense
    user: astrosense_user
