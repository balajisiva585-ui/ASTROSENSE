# ==============================================================================
# ASTROSENSE — Render Blueprint Infrastructure as Code (render.yaml)
# ==============================================================================
# Full-Stack Deployment:
# 1. astrosense-server: Node.js Express API Web Service (Edge Node & Sync Engine)
# 2. astrosense-client: React + Vite Static Site (Webcam HAR + Space UI HUD)
# 3. astrosense-db: Managed PostgreSQL Ground Database
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + TypeScript)
  # ----------------------------------------------------------------------------
  - type: web
    name: astrosense-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_AUTO_SYNC
        value: "true"
      - key: DATABASE_SYNC_INTERVAL_MS
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: astrosense-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: static
          name: astrosense-client
          property: url

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite + Tailwind + OpenCV.js + MediaPipe)
  # ----------------------------------------------------------------------------
  - type: static
    name: astrosense-client
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: astrosense-server
          property: url

databases:
  # ----------------------------------------------------------------------------
  # 3. Ground Database (PostgreSQL)
  # ----------------------------------------------------------------------------
  - name: astrosense-db
    plan: free
    region: oregon
    databaseName: astrosense
    user: astrosense_user
    ipAllowList: [] # Allows all Render internal and external connections
